<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body { margin: 0; font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; }
a { color: #0B2FE0; } a:hover { color: #071C8C; }
</style>
</helmet>
<div style="width:428px;height:926px;background:#F4F5F0;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden">

  <div style="height:96px;box-sizing:border-box;padding:47px 22px 10px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:3px solid #0A0B0D;font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#0A0B0D">
    <span>Wyb&oacute;r operatora</span><span>Dotyka człowiek</span>
  </div>

  <div style="flex:1;background:#0B2FE0;box-sizing:border-box;padding:0 26px;display:grid;grid-template-columns:176px minmax(0,1fr);gap:20px;align-items:center;border-bottom:3px solid #0A0B0D">
    <svg width="176" height="182" viewBox="0 0 120 124" aria-hidden="true">
      <polygon points="34,58 18,10 56,32" fill="#D6F000"/>
      <polygon points="86,58 102,10 64,32" fill="#D6F000"/>
      <ellipse cx="60" cy="64" rx="33" ry="31" fill="#D6F000"/>
      <polygon points="60,66 78,92 60,106 42,92" fill="#D6F000"/>
      <polygon points="60,92 68,99 60,104 52,99" fill="#0B2FE0"/>
      <rect x="43" y="54" width="9" height="9" fill="#0B2FE0"/>
      <rect x="68" y="54" width="9" height="9" fill="#0B2FE0"/>
    </svg>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="font-family:'Archivo',sans-serif;font-weight:800;font-size:58px;line-height:0.92;letter-spacing:-0.03em;color:#D6F000">Karmel</div>
      <div style="display:flex;align-items:center;gap:12px">
        <svg width="34" height="34" viewBox="0 0 52 52" aria-hidden="true">
          <circle cx="20" cy="32" r="13" fill="none" stroke="#F4F5F0" stroke-width="6"/>
          <path d="M31 21 L45 7" stroke="#F4F5F0" stroke-width="6" stroke-linecap="square"/>
          <polyline points="33,7 45,7 45,19" fill="none" stroke="#F4F5F0" stroke-width="6" stroke-linecap="square"/>
        </svg>
        <span style="font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:14px;font-weight:600;letter-spacing:0.08em;color:#F4F5F0;font-variant-numeric:tabular-nums">M &middot; 5 LAT</span>
      </div>
    </div>
  </div>

  <div style="flex:1;background:#D6F000;box-sizing:border-box;padding:0 26px;display:grid;grid-template-columns:176px minmax(0,1fr);gap:20px;align-items:center">
    <svg width="176" height="182" viewBox="0 0 120 124" aria-hidden="true">
      <polygon points="34,58 18,10 56,32" fill="#0A0B0D"/>
      <polygon points="86,58 102,10 64,32" fill="#0A0B0D"/>
      <ellipse cx="60" cy="64" rx="33" ry="31" fill="#0A0B0D"/>
      <polygon points="60,66 78,92 60,106 42,92" fill="#0A0B0D"/>
      <polygon points="60,92 68,99 60,104 52,99" fill="#D6F000"/>
      <rect x="43" y="54" width="9" height="9" fill="#D6F000"/>
      <rect x="68" y="54" width="9" height="9" fill="#D6F000"/>
    </svg>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="font-family:'Archivo',sans-serif;font-weight:800;font-size:58px;line-height:0.92;letter-spacing:-0.03em;color:#0A0B0D">Auri</div>
      <div style="display:flex;align-items:center;gap:12px">
        <svg width="34" height="34" viewBox="0 0 52 52" aria-hidden="true">
          <circle cx="26" cy="19" r="13" fill="none" stroke="#0B2FE0" stroke-width="6"/>
          <path d="M26 32 V47 M17 40 H35" stroke="#0B2FE0" stroke-width="6" fill="none" stroke-linecap="square"/>
        </svg>
        <span style="font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:14px;font-weight:600;letter-spacing:0.08em;color:#0B2FE0;font-variant-numeric:tabular-nums">F &middot; 12 LAT</span>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
